<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="amt" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1b2d"/><stop offset=".6" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 40) scale(620 360)">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 360) scale(520 320)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f1b2d" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect x="4" y="4" width="1272" height="372" rx="30"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
<linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="iarc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="#f6f8fc"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect width="1280" height="380" fill="url(#g1)"/>
    <rect width="1280" height="380" fill="url(#g2)"/>
    <circle cx="-30" cy="400" r="130" fill="none" stroke="#a78bfa" stroke-opacity=".08" stroke-width="40"/>
  </g>
  <rect x="4" y="4" width="1272" height="372" rx="30" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- Marque -->
  <g transform="translate(64 58) scale(.125)"><rect width="512" height="512" rx="112" fill="url(#ibg)"/><path d="M146 352 A136 136 0 1 1 366 352" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="40" stroke-linecap="round"/><path d="M146 352 A136 136 0 0 1 318 150" fill="none" stroke="url(#iarc)" stroke-width="40" stroke-linecap="round"/><circle cx="318" cy="150" r="20" fill="#fff"/><path d="M256 276 L310 196" stroke="#fff" stroke-width="22" stroke-linecap="round"/><circle cx="256" cy="276" r="30" fill="#fff"/><circle cx="256" cy="276" r="12" fill="#4338ca"/></g>
  <text x="148" y="84" font-size="15" font-weight="800" letter-spacing="2.4" fill="#54637a">RÉPUBLIQUE DE DJIBOUTI</text>
  <text x="148" y="108" font-size="14" fill="#7a879b">Pension normale de retraite · RG · FCT · FNP · DMG</text>

  <!-- Titre -->
  <text x="64" y="196" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#0f1b2d">Simulateur de pension</text>
  <text x="64" y="238" font-size="21" fill="#405068">Estimez votre retraite en temps réel — aujourd'hui et à votre départ.</text>

  <!-- Puces régimes -->
  <g font-size="14" font-weight="800">
    <rect x="64" y="276" width="62" height="34" rx="17" fill="url(#brand)"/>
    <text x="95" y="298" text-anchor="middle" fill="#fff">RG</text>
    <rect x="136" y="276" width="66" height="34" rx="17" fill="#ffffff" stroke="#0f1b2d" stroke-opacity=".14"/>
    <text x="169" y="298" text-anchor="middle" fill="#0f1b2d">FCT</text>
    <rect x="212" y="276" width="66" height="34" rx="17" fill="#ffffff" stroke="#0f1b2d" stroke-opacity=".14"/>
    <text x="245" y="298" text-anchor="middle" fill="#0f1b2d">FNP</text>
    <rect x="288" y="276" width="70" height="34" rx="17" fill="#ffffff" stroke="#0f1b2d" stroke-opacity=".14"/>
    <text x="323" y="298" text-anchor="middle" fill="#0f1b2d">DMG</text>
    <circle cx="390" cy="293" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="404" y="298" font-weight="600" fill="#54637a">Calcul 100 % local · FR / EN · Installable</text>
  </g>

  <!-- Jauge -->
  <g transform="translate(1000 196)">
    <path d="M-118 96 A150 150 0 1 1 118 96" fill="none" stroke="#0f1b2d" stroke-opacity=".08" stroke-width="22" stroke-linecap="round"/>
    <path d="M-118 96 A150 150 0 1 1 118 96" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round" filter="url(#glow)" opacity=".55" stroke-dasharray="560 1000"/>
    <path d="M-118 96 A150 150 0 1 1 118 96" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round" stroke-dasharray="560 1000">
      <animate attributeName="stroke-dasharray" values="0 1000;560 1000" dur="1.6s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>
    </path>
    <text x="0" y="-34" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.2" fill="#54637a">PENSION NETTE / MOIS</text>
    <text x="0" y="22" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="-2" fill="url(#amt)">137 498</text>
    <text x="0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#54637a">FDJ</text>
    <rect x="-54" y="74" width="108" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".4"/>
    <text x="0" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">Taux 52,5 %</text>
  </g>
</svg>
